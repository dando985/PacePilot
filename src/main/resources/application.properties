spring.application.name=PacePilot

pacepilot.ollama.base-url=http://localhost:11434
pacepilot.ollama.embedding-model=embeddinggemma
pacepilot.ollama.chat-model=llama3.2:3b
pacepilot.ollama.max-output-tokens=300
pacepilot.retrieval.minimum-similarity=0.50

spring.datasource.url=${PACEPILOT_DB_URL:jdbc:postgresql://localhost:5432/pacepilot}
spring.datasource.username=${PACEPILOT_DB_USERNAME:user}
spring.datasource.password=${PACEPILOT_DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
