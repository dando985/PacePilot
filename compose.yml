services:
  postgres:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pacepilot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pacepilot-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pacepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pacepilot-postgres-data: